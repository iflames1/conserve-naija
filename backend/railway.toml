# Railway service for cn-server. Set the service root to `backend/`.
# Pair with the Postgres Docker service in this repo (`infra/postgres`).
#
# DATABASE_URL=postgres://USER:PASSWORD@<postgres-private-host>:5432/conserve_naija
# Private hostname looks like xxx.railway.internal

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Cheap liveness on $PORT (same port the public proxy uses). Do not point
# this at /ready — that waits on Postgres.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
