# cn-server. Railway service can use the repo root (this file) or set
# the service root to `backend/` (then backend/railway.toml applies).
#
# Postgres is a second service. Set THAT service's root to `infra/postgres`.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Cheap liveness on $PORT (same port the public proxy uses). Do not point
# this at /ready — that waits on Postgres.
healthcheckPath = "/health"
healthcheckTimeout = 30
# Railway Serverless (formerly App Sleeping) stops the replica after ~10 min
# with no outbound packets. Inbound /health does not count. Cold boot then
# hangs past the app's 8s fetch abort ("signal timed out").
sleepApplication = false
numReplicas = 1
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10
