# Local infra. Day-to-day is `cargo run` + `bun dev`.
#
#   docker compose up -d postgres
#   docker compose --profile server up --build   # optional cn-server image
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conserve_naija
    ports:
      - "5434:5432"
    volumes:
      - conserve_naija_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conserve_naija"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: hydra
    depends_on:
      postgres:
        condition: service_healthy

  cn-server:
    profiles: ["server"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/conserve_naija
      HOST: 0.0.0.0
      PORT: "8080"
      MIGRATIONS_DIR: /app/migrations
      APP_URL: http://localhost:3000
      INTERNAL_API_SECRET: cn-dev-internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  conserve_naija_pg:
