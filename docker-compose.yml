services:
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: conserve
            POSTGRES_PASSWORD: conserve
            POSTGRES_DB: conserve_naija
        ports:
            - "5433:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U conserve -d conserve_naija"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres-data:
