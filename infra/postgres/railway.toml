# Railway Postgres service. Set the service root to `infra/postgres`.
# Attach a volume at /var/lib/postgresql/data.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Postgres must not Serverless-sleep. If this replica stops, cn-server hangs
# on every real request even though /health (no DB) still looks fine.
sleepApplication = false
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10
